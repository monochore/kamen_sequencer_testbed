<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAMEN - Lithic Liturgy Engine</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap');
    :root {
        --bg: #0c0c0c; --panel: #111111; --border-main: #ffffff; --col-div: rgba(255, 255, 255, 0.25);
        --c-green: #00ff44; --c-amber: #ff9d00; --c-cyan: #00aaff; --c-red: #ff4444; --c-neutral: #ffffff;
        --text-dim: #bbbbbb;
    }
    body, #chassis, .column, .oled-container, .knob-container, #seq-shelf {
        -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    body { background-color: var(--bg); color: #fff; font-family: 'Oswald', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    
    #chassis { display: flex; flex-direction: column; background-color: var(--panel); border: 2px solid var(--border-main); outline: 2px solid var(--border-main); outline-offset: -8px; padding: 10px; box-shadow: inset 0 0 60px rgba(0,0,0,0.9), 0 20px 50px rgba(0,0,0,0.8); transform-origin: center center; }
    .upper-deck { display: flex; flex-direction: row; width: 100%; }
    .vertical-text { writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 14px; font-weight: 500; letter-spacing: 6px; padding: 0 15px; color: var(--text-dim); display: flex; align-items: center; justify-content: center; }
    .panel-core { display: flex; border-left: 1px solid var(--col-div); border-right: 1px solid var(--col-div); padding: 15px 0; }
    
    .column { width: 155px; display: flex; flex-direction: column; align-items: center; border-right: 1px solid var(--col-div); padding: 0 5px; position: relative; }
    .column:last-child { border-right: none; }
    .col-header { font-size: 14px; letter-spacing: 2px; margin-bottom: 15px; text-transform: uppercase; color: var(--text-dim); height: 20px; text-align: center; transition: color 0.3s ease, text-shadow 0.3s ease; }
    
    .oled-container { width: 140px; background: #000; border: 1px solid #333; margin-bottom: 12px; display: flex; flex-direction: column; align-items: center; padding: 5px; box-sizing: border-box; box-shadow: inset 0 0 10px rgba(255,255,255,0.05); }
    #scope { width: 100%; height: 40px; background: #050505; margin-bottom: 6px; border: 1px solid #222; cursor: pointer; }
    .oled-row { display: flex; width: 100%; justify-content: space-between; margin-bottom: 5px; gap: 2px; }
    .oled-btn { flex: 1; background: transparent; border: 1px solid #555; color: #fff; font-family: 'Oswald', sans-serif; font-size: 9px; padding: 3px 0; cursor: pointer; text-transform: uppercase; transition: 0.1s; text-align: center; }
    .oled-btn:hover { background: #333; }
    .oled-btn.active { background: var(--border-main); color: #000; }
    
    #ab-slider::-webkit-slider-thumb { appearance: none; width: 8px; height: 12px; background: #fff; cursor: pointer; }
    #preset-list { width: 100%; background: #000; color: var(--border-main); border: 1px solid #555; font-family: 'Oswald', sans-serif; font-size: 10px; outline: none; padding: 2px; }
    
    .knob-group { display: flex; flex-direction: column; align-items: center; margin-bottom: 15px; width: 100%; }
    .knob-row { display: flex; justify-content: space-evenly; width: 100%; margin-bottom: 15px; }
    .knob-container { display: flex; flex-direction: column; align-items: center; position: relative; }
    .knob-label { font-size: 10px; margin-bottom: 4px; letter-spacing: 1px; text-transform: uppercase; }
    .knob-svg { width: 40px; height: 40px; cursor: ns-resize; overflow: visible; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5)); touch-action: none; }
    .knob-bg { fill: #1c1c1c; stroke-width: 2.5px; }
    .knob-indicator { stroke: #fff; stroke-width: 2.5px; stroke-linecap: round; }
    .knob-svg.plocked .knob-indicator { stroke: var(--c-red); stroke-width: 3.5px; }
    .knob-svg.mod-active .knob-indicator { stroke: var(--c-amber); }
    
    /* Column Color Mapping matching KAMEN Faceplate */
    .col-global .knob-bg { stroke: var(--c-neutral); } .col-global .knob-label { color: var(--text-dim); }
    .col-inv .knob-bg    { stroke: var(--c-amber); }   .col-inv .knob-label    { color: var(--c-amber); }
    .col-sanc .knob-bg   { stroke: var(--c-cyan); }    .col-sanc .knob-label   { color: var(--c-cyan); }
    .col-fak .knob-bg    { stroke: var(--c-green); }   .col-fak .knob-label    { color: var(--c-green); }

    /* IMMERSIVE ASCII SCANLINE SEQUENCER & VOTIVE ALTAR SHELF */
    #seq-shelf {
        border-top: 1px solid var(--col-div);
        margin: 0 6px;
        padding: 10px 12px 6px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: rgba(0,0,0,0.42);
    }
    .seq-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
    }
    .seq-section {
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .seq-title {
        font-size: 10px;
        letter-spacing: 2.5px;
        color: var(--text-dim);
        margin-right: 4px;
    }
    .seq-btn {
        background: #080808;
        border: 1px solid #444;
        color: var(--text-dim);
        font-family: 'Oswald', sans-serif;
        font-size: 9.5px;
        letter-spacing: 1.2px;
        padding: 3px 8px;
        cursor: pointer;
        text-transform: uppercase;
        transition: 0.1s;
    }
    .seq-btn:hover { background: #222; color: #fff; }
    .seq-btn.active { background: #fff; color: #000; border-color: #fff; }

    .seq-btn.v-sel[data-v="0"].active { background: var(--c-neutral); border-color: var(--c-neutral); color: #000; box-shadow: 0 0 8px rgba(255,255,255,0.5); }
    .seq-btn.v-sel[data-v="1"].active { background: var(--c-amber);   border-color: var(--c-amber);   color: #000; box-shadow: 0 0 8px rgba(255,157,0,0.5); }
    .seq-btn.v-sel[data-v="2"].active { background: var(--c-cyan);    border-color: var(--c-cyan);    color: #000; box-shadow: 0 0 8px rgba(0,170,255,0.5); }
    .seq-btn.v-sel[data-v="3"].active { background: var(--c-green);   border-color: var(--c-green);   color: #000; box-shadow: 0 0 8px rgba(0,255,68,0.5); }

    #btn-seq-on.active {
        background: var(--c-green);
        border-color: var(--c-green);
        color: #000;
        box-shadow: 0 0 10px rgba(0,255,68,0.45);
    }
    #btn-mod-mode.active {
        background: var(--c-red);
        border-color: var(--c-red);
        color: #000;
        box-shadow: 0 0 12px var(--c-red);
    }
    #btn-hold-mode.active {
        background: var(--c-amber);
        border-color: var(--c-amber);
        color: #000;
    }
    #btn-len { cursor: ns-resize; touch-action: none; }

    /* UNIFIED ASCII ALTAR + 4-LANE SCANLINE MATRIX */
    #altar-matrix-wrap {
        width: 100%;
        background: #040404;
        border: 1px solid #262626;
        padding: 4px 6px 2px 6px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 2px;
        box-shadow: inset 0 0 25px rgba(0,0,0,0.95);
    }
    .ascii-lanes {
        display: flex;
        flex-direction: column;
        gap: 2px;
        border-bottom: 1px dashed #222;
        padding-bottom: 3px;
    }
    .ascii-lane-row {
        display: grid;
        grid-template-columns: 28px repeat(16, 1fr) 36px;
        align-items: center;
        height: 15px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 11px;
        letter-spacing: 0px;
    }
    .ascii-lane-row.selected-lane {
        background: rgba(255,255,255,0.04);
    }
    .lane-tag {
        font-weight: bold;
        cursor: pointer;
        padding-left: 3px;
        font-size: 10px;
    }
    .lane-len-tag {
        font-size: 9px;
        color: #666;
        text-align: right;
        padding-right: 3px;
        cursor: ns-resize;
    }
    .ascii-cell {
        text-align: center;
        cursor: pointer;
        color: #333;
        font-weight: bold;
        line-height: 15px;
        transition: color 0.05s, text-shadow 0.05s;
        user-select: none;
    }
    .ascii-cell:nth-child(4n+2) {
        border-left: 1px solid #1c1c1c;
    }
    .ascii-cell:hover {
        color: #999;
        background: rgba(255,255,255,0.05);
    }
    .ascii-cell.out-bounds {
        opacity: 0.18;
    }
    .ascii-cell.trig-on[data-l="0"] { color: var(--c-neutral); text-shadow: 0 0 6px var(--c-neutral); }
    .ascii-cell.trig-on[data-l="1"] { color: var(--c-amber);   text-shadow: 0 0 6px var(--c-amber); }
    .ascii-cell.trig-on[data-l="2"] { color: var(--c-cyan);    text-shadow: 0 0 6px var(--c-cyan); }
    .ascii-cell.trig-on[data-l="3"] { color: var(--c-green);   text-shadow: 0 0 6px var(--c-green); }

    .ascii-cell.has-plock {
        color: var(--c-red) !important;
        text-shadow: 0 0 8px var(--c-red) !important;
    }
    .ascii-cell.playhead {
        color: #fff !important;
        background: rgba(255,255,255,0.16);
        text-shadow: 0 0 8px #fff;
    }
    .ascii-cell.mod-editing {
        color: #fff !important;
        background: rgba(255, 68, 68, 0.45) !important;
        box-shadow: 0 0 8px var(--c-red);
    }

    #ascii-bed {
        font-family: 'Courier New', Courier, monospace;
        font-size: 9px;
        line-height: 9px;
        letter-spacing: 0px;
        white-space: pre;
        margin: 0;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-image: linear-gradient(90deg, #ffffff, #ff9d00, #00aaff, #00ff44);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        filter: drop-shadow(0 0 5px rgba(255, 157, 0, 0.45));
    }
</style>
</head>
<body>
<div id="chassis">
    <div class="upper-deck">
        <div class="vertical-text">KAMEN</div>
        <div class="panel-core">
            
            <!-- COLUMN 1: GLOBAL & OLED -->
            <div class="column col-global" data-col="global">
                <div class="col-header" id="hdr-global">GLOBAL</div>
                <div class="oled-container">
                    <canvas id="scope" title="Click to cycle Scope / Seismograph / Liturgical BPM & Chord"></canvas>
                    <div class="oled-row">
                        <button class="oled-btn" id="btn-activate">ACTIVATE</button>
                        <button class="oled-btn" id="btn-scatter">SCATTER</button>
                    </div>
                    <div class="oled-row">
                        <button class="oled-btn" id="btn-dump">DUMP</button>
                        <button class="oled-btn" id="btn-rec">REC</button>
                        <button class="oled-btn" id="btn-drift">DRIFT</button>
                    </div>
                    <div class="oled-row" style="margin-bottom: 5px;">
                        <div style="display:flex; flex: 1; align-items:center; justify-content:center; background:#111; border:1px solid #333; padding:0 2px;">
                            <button class="oled-btn" id="btn-a" style="border:none; padding:2px; min-width:15px; color:#aaa;">A</button>
                            <input type="range" id="ab-slider" min="0" max="1" step="0.001" value="0" style="width: 50px; flex: none; margin: 0 10px; height: 2px; -webkit-appearance: none; background: #555; outline: none;">
                            <button class="oled-btn" id="btn-b" style="border:none; padding:2px; min-width:15px; color:#aaa;">B</button>
                        </div>
                    </div>
                    <select id="preset-list"><option value="init">INITIALIZED</option></select>
                </div>
                
                <div class="knob-group" style="margin-top: 10px;">
                    <div class="knob-container"><div class="knob-label">ALTITUDE</div><svg class="knob-svg" id="ALTITUDE" data-val="0.5" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                </div>
                <div class="knob-row" style="margin-top: 10px;">
                    <div class="knob-container"><div class="knob-label">INCENSE</div><svg class="knob-svg" id="INCENSE" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                    <div class="knob-container"><div class="knob-label">VELOCITY</div><svg class="knob-svg" id="VELOCITY" data-val="0.8" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                </div>
            </div>

            <!-- COLUMN 2: I. INVOCATION & OFFERING -->
            <div class="column col-inv" data-col="inv">
                <div class="col-header" id="hdr-inv">I. INVOCATION</div>
                <div class="knob-row" style="margin-top: 10px;">
                    <div class="knob-container"><div class="knob-label">LITURGY</div><svg class="knob-svg" id="LITURGY" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                    <div class="knob-container"><div class="knob-label">GRAVITY</div><svg class="knob-svg" id="GRAVITY" data-val="0.5" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                </div>
                <div class="knob-group" style="margin: 10px 0;">
                    <div class="knob-container"><div class="knob-label">FRAY</div><svg class="knob-svg" id="MUTE_OFFER" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                </div>
                <div class="knob-row" style="margin-top: 10px;">
                    <div class="knob-container"><div class="knob-label">OFFER</div><svg class="knob-svg" id="OFFER" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                    <div class="knob-container"><div class="knob-label">TITHE</div><svg class="knob-svg" id="TITHE" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                </div>
            </div>

            <!-- COLUMN 3: II. SANCTUARY & PENANCE -->
            <div class="column col-sanc" data-col="sanc">
                <div class="col-header" id="hdr-sanc">II. SANCTUARY</div>
                <div class="knob-row" style="margin-top: 10px;">
                    <div class="knob-container"><div class="knob-label">CELLA</div><svg class="knob-svg" id="CELLA" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                    <div class="knob-container"><div class="knob-label">ORIGIN</div><svg class="knob-svg" id="ORIGIN" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                </div>
                <div class="knob-row" style="margin-top: 45px;">
                    <div class="knob-container"><div class="knob-label">PENANCE</div><svg class="knob-svg" id="PENANCE" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                    <div class="knob-container"><div class="knob-label">SCHISM</div><svg class="knob-svg" id="SCHISM" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                </div>
            </div>

            <!-- COLUMN 4: III. FAKTURA -->
            <div class="column col-fak" data-col="fak">
                <div class="col-header" id="hdr-fak">III. FAKTURA</div>
                <div class="knob-group" style="margin-top: 10px;">
                    <div class="knob-container"><div class="knob-label">KIGAL</div><svg class="knob-svg" id="KIGAL" data-val="0.5" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                </div>
                <div class="knob-row" style="margin-top: 45px;">
                    <div class="knob-container"><div class="knob-label">SKOL</div><svg class="knob-svg" id="SKOL" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                    <div class="knob-container"><div class="knob-label">KUR</div><svg class="knob-svg" id="KUR" data-val="0.5" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                </div>
            </div>
        </div>
        <div class="vertical-text">LITHIC LITURGY ENGINE</div>
    </div>

    <!-- IMMERSIVE 4-LANE ASCII SCANLINE SEQUENCER & VOTIVE ALTAR -->
    <div id="seq-shelf">
        <div class="seq-bar">
            <div class="seq-section">
                <span class="seq-title">ALTAR MATRIX</span>
                <button class="seq-btn v-sel active" data-v="0" title="Lane A: Swell & Harmonic Shimmer Pulse + Any Param Locks">A. SWELL</button>
                <button class="seq-btn v-sel" data-v="1" title="Lane B: Sacrificial Drive & Fold Strike + Any Param Locks">B. FOLD</button>
                <button class="seq-btn v-sel" data-v="2" title="Lane C: Sanctuary Stone Strike + Any Param Locks">C. STONE</button>
                <button class="seq-btn v-sel" data-v="3" title="Lane D: Kigal Sub-Pillar Thump + Any Param Locks">D. SUB</button>
            </div>
            <div class="seq-section">
                <button class="seq-btn active" id="btn-seq-on" title="Master Sequencer On/Off">SEQ: ON</button>
                <button class="seq-btn" id="btn-mod-mode" title="MOD OFF: Click steps to add/remove triggers | MOD ON: Click active step to lock/clear any dial">MOD</button>
                <button class="seq-btn active" id="btn-hold-mode" title="HOLD: Locked dials sustain until next active step | REV: Revert to base dials on empty steps">HOLD</button>
                <button class="seq-btn" id="btn-len" title="Click to cycle 16/32/48/64, Drag vertically for 1-64, or Alt-Click any step">LEN: 16</button>
                <button class="seq-btn" id="btn-view-page" title="Switch 16-step page window">PG: 1/1</button>
                <button class="seq-btn" id="btn-clr-lane" title="MOD ON: Clear locks on lane | MOD OFF: Clear all steps & locks on lane">CLR</button>
                <div style="display:flex; align-items:center; gap:5px; margin-left:4px; padding-left:6px; border-left:1px solid #333;">
                    <span class="knob-label" style="margin:0; color:var(--c-amber); font-size:9px;">PACE</span>
                    <svg class="knob-svg" id="seq_pace" data-val="0.38" viewBox="0 0 44 44" style="width:28px; height:28px;"><circle class="knob-bg" cx="22" cy="22" r="18" style="stroke:var(--c-amber);"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg>
                    <span class="knob-label" style="margin:0 0 0 4px; color:var(--c-red); font-size:9px;">DRAG</span>
                    <svg class="knob-svg" id="seq_drag" data-val="0.0" viewBox="0 0 44 44" style="width:28px; height:28px;"><circle class="knob-bg" cx="22" cy="22" r="18" style="stroke:var(--c-red);"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg>
                </div>
            </div>
        </div>
        <div id="altar-matrix-wrap">
            <div class="ascii-lanes" id="ascii-lanes"></div>
            <div id="ascii-bed"></div>
        </div>
    </div>
</div>

<script>
function fitToScreen() {
    const chassis = document.getElementById('chassis');
    chassis.style.transform = 'none'; 
    const rect = chassis.getBoundingClientRect();
    const padding = 20; 
    const scaleX = window.innerWidth / (rect.width + padding);
    const scaleY = window.innerHeight / (rect.height + padding);
    const scale = Math.min(1, scaleX, scaleY); 
    chassis.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', fitToScreen);
setTimeout(fitToScreen, 50);

const workletString = `
class SafeDelay {
    constructor(size) { this.size = size; this.buf = new Float32Array(size); this.writeIdx = 0; }
    write(val) { if(isNaN(val)) val = 0; this.buf[this.writeIdx] = val; this.writeIdx = (this.writeIdx + 1) % this.size; }
    read(sAgo, interp = "spline") {
        if(isNaN(sAgo)) sAgo = 0; sAgo = Math.max(0, Math.min(sAgo, this.size - 2)); 
        let rPos = this.writeIdx - sAgo; while(rPos < 0) rPos += this.size;
        let i1 = Math.floor(rPos); let i2 = (i1 + 1) % this.size; let frac = rPos - i1;
        let val = this.buf[i1] + frac * (this.buf[i2] - this.buf[i1]);
        return isNaN(val) ? 0 : val;
    }
}

class KamenProcessor extends AudioWorkletProcessor {
    constructor() {
        super();
        this.p = { ALTITUDE: 0.5, INCENSE: 0, VELOCITY: 0.8, GRAVITY: 0.5, LITURGY: 0, OFFER: 0, TITHE: 0, CELLA: 0, ORIGIN: 0, PENANCE: 0, SCHISM: 0, KIGAL: 0.5, KUR: 0.5, SKOL: 0, MUTE_OFFER: 0, seq_pace: 0.38, seq_drag: 0.0 };
        
        // 4 Liturgical Lane Articulation Envelopes (Make active steps sonically obvious even with 0 locks)
        this.p_env0 = 0; // Lane A: Harmonic Shimmer & Lung-Swell Bloom
        this.p_env1 = 0; // Lane B: Sacrificial Gravity & Tithe Fold Strike
        this.p_env2 = 0; // Lane C: Sanctuary Stone & Comb Choir Strike
        this.p_env3 = 0; // Lane D: Kigal Sub-Pillar Tectonic Thump

        this.port.onmessage = e => {
            if (e.data.type === 'lane_pulse') {
                const l = e.data.lane;
                if (l === 0) {
                    this.p_env0 = 1.0;
                    this.offer_ph = 0.15; // Nudge lung-swell into upward breath
                } else if (l === 1) {
                    this.p_env1 = 1.0;
                    // Re-articulate FRAY sample-and-hold gates
                    let rt = -0.5 + (this.ruin_glided * 1.2);
                    this.v_gate1 = (this.noise() > rt) ? 1.0 : 0.0;
                    this.v_gate2 = (this.noise() > rt) ? 1.0 : 0.0;
                    this.v_gate3 = (this.noise() > rt) ? 1.0 : 0.0;
                    this.v_gate4 = (this.noise() > rt) ? 1.0 : 0.0;
                } else if (l === 2) {
                    this.p_env2 = 1.0;
                } else if (l === 3) {
                    this.p_env3 = 1.0;
                }
            } else if (e.data.id && this.p[e.data.id] !== undefined) {
                this.p[e.data.id] = e.data.value;
            }
        };
        
        this.lithic_buffer = new Float32Array(96000);
        this.choir_comb_L = new SafeDelay(4800);
        this.choir_comb_R = new SafeDelay(4800);

        this.diff_L1 = new SafeDelay(411); this.diff_L2 = new SafeDelay(613);
        this.diff_R1 = new SafeDelay(433); this.diff_R2 = new SafeDelay(599);

        this.write_idx = 0;
        this.dc_in_L = 0; this.dc_out_L = 0; this.dc_in_R = 0; this.dc_out_R = 0;
        this.kur_glided = 0.5; this.grav_glided = 0.5;
        this.lp_cavern_L = 0; this.lp_cavern_R = 0;
        this.choir_lp_L = 0; this.choir_lp_R = 0;

        this.glided_lit = 0.0;
        this.offer_ph = 0;
        this.orig_ph = 0;
        this.rot_lp = 0;
        this.crackle_lp = 0;
        this.wind_lp_L = 0; this.wind_lp_R = 0;
        this.muffle_L = 0; this.muffle_R = 0;

        this.ph0 = 0;
        this.ph1 = 0; this.ph2 = 0; this.ph3 = 0; this.ph4 = 0;
        this.drift_ph1 = 0; this.drift_ph2 = 0; this.drift_ph3 = 0; this.drift_ph4 = 0;
        this.r1 = 1.0; this.r2 = 1.5; this.r3 = 2.0; this.r4 = 3.0;

        this.ruin_glided = 0.0;
        this.ruin_ph1 = 0; this.ruin_ph2 = 0; this.ruin_ph3 = 0; this.ruin_ph4 = 0;
        this.v_gate1 = 1; this.v_gate2 = 1; this.v_gate3 = 1; this.v_gate4 = 1;
        this.g_slew1 = 1; this.g_slew2 = 1; this.g_slew3 = 1; this.g_slew4 = 1;

        this.s_alt = 0.5; this.s_inc = 0; this.s_vel = 0.8; this.s_lit = 0;
        this.s_off = 0; this.s_tithe = 0; this.s_orig = 0; this.s_pen = 0; this.s_sch = 0;
        this.s_kig = 0.5; this.s_kur = 0.5; this.s_skol = 0; this.s_cella = 0;

        this.seq_ph = 0;
        this.prev_seq_ph = 0;
        this.fc = 0;
        this.last_swell = 0.5;
        this.twopi = Math.PI * 2;
    }

    noise() { return Math.random() * 2 - 1; }
    wrap(v, min, max) { let r = max - min; if(r === 0) return min; let res = (v - min) % r; if(res < 0) res+=r; return res+min; }
    clip(v, min, max) { return Math.max(min, Math.min(max, v)); }

    process(ins, outs) {
        const outL = outs[0][0]; const outR = outs[0][1];
        if (!outL || !outR) return true;
        const sr = sampleRate;

        // DRAG portamento scaling: 0 = razor-snappy immediate locks, 1 = deep glacial bend
        let drag = this.clip(this.p.seq_drag, 0, 1);
        let slew, glide_fast, glide_slow, c_slew;
        if (drag < 0.02) {
            slew = 0.025;
            glide_fast = 0.015;
            glide_slow = 0.008;
            c_slew = 0.35;
        } else {
            let drag_curve = 1.0 / (1.0 + Math.pow(drag, 2.0) * 55.0);
            slew = 0.002 * drag_curve;
            glide_fast = 0.0005 * drag_curve;
            glide_slow = 0.0002 * drag_curve;
            c_slew = 0.05 * drag_curve;
        }

        // PACE sequencer clock: 0 = Paused, 0.01..1.0 = 15 BPM to 180 BPM
        let pace = this.clip(this.p.seq_pace, 0, 1);
        let bpm = pace > 0.01 ? (15.0 + pace * 165.0) : 0.0;
        let step_hz = (bpm / 60.0) * 4.0;

        for (let i = 0; i < outL.length; i++) {
            if (step_hz > 0) {
                this.seq_ph = this.wrap(this.seq_ph + (step_hz / sr), 0.0, 1.0);
                if (this.seq_ph < this.prev_seq_ph) {
                    this.port.postMessage({ type: 'seq_tick' });
                }
                this.prev_seq_ph = this.seq_ph;
            }

            // Decay the 4 lane articulation pulse envelopes
            this.p_env0 *= 0.9993;
            this.p_env1 *= 0.9991;
            this.p_env2 *= 0.9992;
            this.p_env3 *= 0.9990;

            let ALTITUDE = this.p.ALTITUDE;
            let INCENSE = this.p.INCENSE;
            let VELOCITY = this.p.VELOCITY;
            let GRAVITY = this.p.GRAVITY;
            let LITURGY = this.p.LITURGY;
            let OFFER = this.p.OFFER;
            let TITHE = this.p.TITHE;
            let CELLA = this.p.CELLA;
            let ORIGIN = this.p.ORIGIN;
            let PENANCE = this.p.PENANCE;
            let SCHISM = this.p.SCHISM;
            let KIGAL = this.p.KIGAL;
            let KUR = this.p.KUR;
            let SKOL = this.p.SKOL;
            let MUTE_OFFER = this.p.MUTE_OFFER;

            this.s_alt   = this.s_alt + slew * (this.clip(ALTITUDE, 0, 1) - this.s_alt);
            this.s_inc   = this.s_inc + slew * (this.clip(INCENSE, 0, 1) - this.s_inc);
            this.s_vel   = this.s_vel + slew * (this.clip(VELOCITY, 0, 1) - this.s_vel);
            this.s_lit   = this.s_lit + slew * (this.clip(LITURGY, 0, 1) - this.s_lit);
            this.s_off   = this.s_off + slew * (this.clip(OFFER, 0, 1) - this.s_off);
            this.s_tithe = this.s_tithe + slew * (this.clip(TITHE, 0, 1) - this.s_tithe);
            this.s_cella = this.s_cella + slew * (this.clip(CELLA, 0, 1) - this.s_cella);
            this.s_orig  = this.s_orig + slew * (this.clip(ORIGIN, 0, 1) - this.s_orig);
            this.s_pen   = this.s_pen + slew * (this.clip(PENANCE, 0, 1) - this.s_pen);
            this.s_sch   = this.s_sch + slew * (this.clip(SCHISM, 0, 1) - this.s_sch);
            this.s_kig   = this.s_kig + slew * (this.clip(KIGAL, 0, 1) - this.s_kig);
            this.s_kur   = this.s_kur + slew * (this.clip(KUR, 0, 1) - this.s_kur);
            this.s_skol  = this.s_skol + slew * (this.clip(SKOL, 0, 1) - this.s_skol);

            this.grav_glided = this.grav_glided + glide_fast * (this.clip(GRAVITY, 0, 1) - this.grav_glided);
            this.glided_lit = this.glided_lit + glide_fast * (this.s_lit - this.glided_lit);

            let mute_target = this.clip(MUTE_OFFER, 0, 1);
            this.ruin_glided = this.ruin_glided + glide_slow * (mute_target - this.ruin_glided);

            this.orig_ph = this.wrap(this.orig_ph + (0.3 / sr), 0.0, 1.0);
            let tape_wow = Math.sin(this.orig_ph * this.twopi) * (this.s_orig * 0.02 + this.p_env2 * 0.008);

            let target_hz = 30.0 * Math.pow(16.0, this.glided_lit);
            let root_hz = target_hz * (1.0 + tape_wow);

            let state = Math.floor(this.s_alt * 10.999);
            let t1 = 1.0, t2 = 1.0, t3 = 1.0, t4 = 1.0;
            if (state === 0)      { t1 = 1.0; t2 = 2.0;    t3 = 4.0;    t4 = 2.0; }    
            else if (state === 1) { t1 = 1.0; t2 = 1.4983; t3 = 2.0;    t4 = 2.9966; }
            else if (state === 2) { t1 = 1.0; t2 = 1.3348; t3 = 1.4983; t4 = 2.0; }    
            else if (state === 3) { t1 = 1.0; t2 = 1.1892; t3 = 1.4983; t4 = 2.0; }    
            else if (state === 4) { t1 = 1.0; t2 = 1.1892; t3 = 1.4983; t4 = 1.7818; }
            else if (state === 5) { t1 = 1.0; t2 = 1.1892; t3 = 1.4983; t4 = 2.2449; }
            else if (state === 6) { t1 = 1.0; t2 = 1.1892; t3 = 1.7818; t4 = 2.6696; }
            else if (state === 7) { t1 = 1.0; t2 = 1.2599; t3 = 1.6817; t4 = 2.2449; }
            else if (state === 8) { t1 = 1.0; t2 = 1.2599; t3 = 1.8877; t4 = 2.2449; }
            else if (state === 9) { t1 = 1.0; t2 = 1.2599; t3 = 1.4983; t4 = 1.8877; }
            else                  { t1 = 1.0; t2 = 1.2599; t3 = 1.4983; t4 = 2.0; }    

            this.r1 = this.r1 + c_slew * (t1 - this.r1);
            this.r2 = this.r2 + c_slew * (t2 - this.r2);
            this.r3 = this.r3 + c_slew * (t3 - this.r3);
            this.r4 = this.r4 + c_slew * (t4 - this.r4);

            this.drift_ph1 = this.wrap(this.drift_ph1 + (0.11 / sr), 0.0, 1.0);
            this.drift_ph2 = this.wrap(this.drift_ph2 + (0.17 / sr), 0.0, 1.0);
            this.drift_ph3 = this.wrap(this.drift_ph3 + (0.23 / sr), 0.0, 1.0);
            this.drift_ph4 = this.wrap(this.drift_ph4 + (0.29 / sr), 0.0, 1.0);

            let sch_mod = this.s_sch * 0.03 + this.p_env0 * 0.008;
            let d1 = Math.sin(this.drift_ph1 * this.twopi) * sch_mod;
            let d2 = Math.sin(this.drift_ph2 * this.twopi) * sch_mod;
            let d3 = Math.sin(this.drift_ph3 * this.twopi) * sch_mod;
            let d4 = Math.sin(this.drift_ph4 * this.twopi) * sch_mod;

            this.ph1 = this.wrap(this.ph1 + (root_hz * this.r1 * (1.0 + d1)) / sr, 0.0, 1.0);
            this.ph2 = this.wrap(this.ph2 + (root_hz * this.r2 * (1.0 + d2)) / sr, 0.0, 1.0);
            this.ph3 = this.wrap(this.ph3 + (root_hz * this.r3 * (1.0 + d3)) / sr, 0.0, 1.0);
            this.ph4 = this.wrap(this.ph4 + (root_hz * this.r4 * (1.0 + d4)) / sr, 0.0, 1.0);

            // Lane B pulse (p_env1) injects immediate harmonic drive & wavefold strike
            let grav_drive = 1.0 + (this.grav_glided * 10.0) + (this.p_env1 * 5.5);
            let o1 = Math.tanh(Math.sin(this.ph1 * this.twopi) * grav_drive);
            let o2 = Math.tanh(Math.sin(this.ph2 * this.twopi) * grav_drive);
            let o3 = Math.tanh(Math.sin(this.ph3 * this.twopi) * grav_drive);
            let o4 = Math.tanh(Math.sin(this.ph4 * this.twopi) * grav_drive);

            let ruin_rate = 1.0 + (this.ruin_glided * 4.0);
            let prev_rp1 = this.ruin_ph1;
            let prev_rp2 = this.ruin_ph2;
            let prev_rp3 = this.ruin_ph3;
            let prev_rp4 = this.ruin_ph4;

            this.ruin_ph1 = this.wrap(this.ruin_ph1 + ((0.43 * ruin_rate) / sr), 0.0, 1.0);
            this.ruin_ph2 = this.wrap(this.ruin_ph2 + ((0.61 * ruin_rate) / sr), 0.0, 1.0);
            this.ruin_ph3 = this.wrap(this.ruin_ph3 + ((0.89 * ruin_rate) / sr), 0.0, 1.0);
            this.ruin_ph4 = this.wrap(this.ruin_ph4 + ((1.13 * ruin_rate) / sr), 0.0, 1.0);

            let ruin_thresh = -0.5 + (this.ruin_glided * 1.2);
            let nval = this.noise();

            if (this.ruin_ph1 < prev_rp1) this.v_gate1 = (nval > ruin_thresh) ? 1.0 : 0.0;
            if (this.ruin_ph2 < prev_rp2) this.v_gate2 = (nval > ruin_thresh) ? 1.0 : 0.0;
            if (this.ruin_ph3 < prev_rp3) this.v_gate3 = (nval > ruin_thresh) ? 1.0 : 0.0;
            if (this.ruin_ph4 < prev_rp4) this.v_gate4 = (nval > ruin_thresh) ? 1.0 : 0.0;

            this.g_slew1 = this.g_slew1 + 0.005 * (this.v_gate1 - this.g_slew1);
            this.g_slew2 = this.g_slew2 + 0.005 * (this.v_gate2 - this.g_slew2);
            this.g_slew3 = this.g_slew3 + 0.005 * (this.v_gate3 - this.g_slew3);
            this.g_slew4 = this.g_slew4 + 0.005 * (this.v_gate4 - this.g_slew4);

            o1 = o1 * (1.0 * (1.0 - this.ruin_glided) + this.g_slew1 * this.ruin_glided);
            o2 = o2 * (1.0 * (1.0 - this.ruin_glided) + this.g_slew2 * this.ruin_glided);
            o3 = o3 * (1.0 * (1.0 - this.ruin_glided) + this.g_slew3 * this.ruin_glided);
            o4 = o4 * (1.0 * (1.0 - this.ruin_glided) + this.g_slew4 * this.ruin_glided);

            this.offer_ph = this.wrap(this.offer_ph + (0.5 / sr), 0.0, 1.0);
            let lung_swell = Math.sin(this.offer_ph * this.twopi) * 0.5 + 0.5;
            this.last_swell = Math.min(1.0, lung_swell + this.p_env0 * 0.45);

            let synergy = this.s_off * this.grav_glided;
            let tithe_pwm = this.clip((this.s_tithe - 0.3) / 0.4, 0.0, 1.0) * 0.4 + (this.p_env1 * 0.15);
            let base_fold = this.clip((this.s_tithe - 0.7) / 0.3, 0.0, 1.0) * 2.0;
            let active_fold = base_fold + (lung_swell * synergy * 4.0) + (this.p_env1 * 1.4);

            o1 = Math.sin((o1 + tithe_pwm) * (1.0 + active_fold));
            o2 = Math.sin((o2 + tithe_pwm) * (1.0 + active_fold));
            o3 = Math.sin((o3 + tithe_pwm) * (1.0 + active_fold));
            o4 = Math.sin((o4 + tithe_pwm) * (1.0 + active_fold));

            let pan_c = 1.0 - this.s_sch;
            let pan_s = this.s_sch;

            let base_drone_amp = 1.0 * (1.0 - (this.s_off * (1.0 - this.grav_glided))) + lung_swell * (this.s_off * (1.0 - this.grav_glided));
            let drone_amp = base_drone_amp * (1.0 + this.p_env0 * 0.55);
            let core_L = (o1 * (pan_c + pan_s) + o2 * pan_c + o3 * (pan_c + pan_s) + o4 * pan_c) * 0.25 * drone_amp;
            let core_R = (o1 * pan_c + o2 * (pan_c + pan_s) + o3 * pan_c + o4 * (pan_c + pan_s)) * 0.25 * drone_amp;

            let cval = this.noise();
            this.crackle_lp = this.crackle_lp + 0.05 * (cval - this.crackle_lp);

            let wind_cf = 0.005 + (Math.abs(this.crackle_lp) * this.s_inc * 0.8);
            this.wind_lp_L = this.wind_lp_L + wind_cf * (core_L - this.wind_lp_L);
            this.wind_lp_R = this.wind_lp_R + wind_cf * (core_R - this.wind_lp_R);

            core_L = (core_L * (1.0 - this.s_inc) + this.wind_lp_L * this.s_inc) + (this.crackle_lp * this.s_inc * 0.15);
            core_R = (core_R * (1.0 - this.s_inc) + this.wind_lp_R * this.s_inc) + (this.crackle_lp * this.s_inc * 0.15);

            let orig_muffle = 1.0 * (1.0 - this.s_orig) + 0.02 * this.s_orig;
            this.muffle_L = this.muffle_L + orig_muffle * (core_L - this.muffle_L);
            this.muffle_R = this.muffle_R + orig_muffle * (core_R - this.muffle_R);

            core_L = this.muffle_L;
            core_R = this.muffle_R;
            let mono_core = (core_L + core_R) * 0.5;

            // Lane D pulse (p_env3) drives a deep KIGAL sub-oscillator thump
            this.ph0 = this.wrap(this.ph0 + (root_hz * 0.5 * (1.0 + this.p_env3 * 0.25)) / sr, 0.0, 1.0);
            let kigal_drive = 1.0 + (this.s_kig * 5.0) + (this.p_env3 * 4.5);
            let kigal_amp = Math.min(1.2, this.s_kig * 0.8 + this.p_env3 * 0.55);
            let kigal_pillar = Math.tanh(Math.sin(this.ph0 * this.twopi) * kigal_drive) * kigal_amp;

            this.kur_glided = this.kur_glided + glide_slow * (this.s_kur - this.kur_glided);
            let room_wave = 48000.0 / root_hz;
            let room_mult = 8.0 * (1.0 - this.kur_glided) + 64.0 * this.kur_glided;

            let base_loop_L = room_wave * room_mult;
            let base_loop_R = room_wave * room_mult * 0.66742;

            let tap1_L = this.wrap(this.write_idx - base_loop_L, 0, 96000);
            let tap2_L = this.wrap(this.write_idx - (base_loop_L * 0.618), 0, 96000);
            let tap3_L = this.wrap(this.write_idx - (base_loop_L * 0.382), 0, 96000);
            let cavern_read_A = (this.lithic_buffer[Math.floor(tap1_L)] + this.lithic_buffer[Math.floor(tap2_L)] + this.lithic_buffer[Math.floor(tap3_L)]) * 0.33;

            let tap1_R = this.wrap(this.write_idx - base_loop_R, 0, 96000);
            let tap4_R = this.wrap(this.write_idx - (base_loop_R * 0.800), 0, 96000);
            let tap5_R = this.wrap(this.write_idx - (base_loop_R * 0.200), 0, 96000);
            let cavern_read_B = (this.lithic_buffer[Math.floor(tap1_R)] + this.lithic_buffer[Math.floor(tap4_R)] + this.lithic_buffer[Math.floor(tap5_R)]) * 0.33;

            let loop_idx = this.wrap(this.write_idx - base_loop_L + (tape_wow * 80.0), 0, 96000);
            let raw_amber = this.lithic_buffer[Math.floor(loop_idx)];

            let rot_lp_coef = 1.0 * (1.0 - (this.s_orig * this.s_cella)) + 0.05 * (this.s_orig * this.s_cella);
            let amber_read = this.rot_lp + rot_lp_coef * (raw_amber - this.rot_lp);
            this.rot_lp = amber_read;

            let cavern_read_L = cavern_read_A * (1.0 - this.s_cella) + amber_read * this.s_cella;
            let cavern_read_R = cavern_read_B * (1.0 - this.s_cella) + amber_read * this.s_cella;

            let skol_coef = Math.min(0.75, this.s_skol * 0.7 + this.p_env3 * 0.25);
            let v_L1 = cavern_read_L + (skol_coef * this.diff_L1.read(411)); let out_L1 = this.diff_L1.read(411) - (skol_coef * v_L1); this.diff_L1.write(v_L1);
            let v_L2 = out_L1 + (skol_coef * this.diff_L2.read(613)); let out_L2 = this.diff_L2.read(613) - (skol_coef * v_L2); this.diff_L2.write(v_L2);
            cavern_read_L = out_L2;

            let v_R1 = cavern_read_R + (skol_coef * this.diff_R1.read(433)); let out_R1 = this.diff_R1.read(433) - (skol_coef * v_R1); this.diff_R1.write(v_R1);
            let v_R2 = out_R1 + (skol_coef * this.diff_R2.read(599)); let out_R2 = this.diff_R2.read(599) - (skol_coef * v_R2); this.diff_R2.write(v_R2);
            cavern_read_R = out_R2;

            let damp_coef = 0.02 + (this.s_kur * 0.98);
            this.lp_cavern_L = this.lp_cavern_L + damp_coef * (cavern_read_L - this.lp_cavern_L);
            this.lp_cavern_R = this.lp_cavern_R + damp_coef * (cavern_read_R - this.lp_cavern_R);

            let fb_blocked_L = this.lp_cavern_L - this.dc_in_L + (0.995 * this.dc_out_L); this.dc_in_L = this.lp_cavern_L; this.dc_out_L = fb_blocked_L;
            let fb_blocked_R = this.lp_cavern_R - this.dc_in_R + (0.995 * this.dc_out_R); this.dc_in_R = this.lp_cavern_R; this.dc_out_R = fb_blocked_R;

            let final_abyss_L = Math.tanh(fb_blocked_L);
            let final_abyss_R = Math.tanh(fb_blocked_R);

            let choir_samps_L = 48000.0 / (root_hz * 2.0);
            let choir_samps_R = 48000.0 / (root_hz * 2.9966);

            let c_read_L = this.choir_comb_L.read(choir_samps_L);
            let c_read_R = this.choir_comb_R.read(choir_samps_R);

            this.choir_lp_L = this.choir_lp_L + 0.15 * (c_read_L - this.choir_lp_L);
            this.choir_lp_R = this.choir_lp_R + 0.15 * (c_read_R - this.choir_lp_R);

            // Lane C pulse (p_env2) strikes the choir comb & cavern stone loop
            let stone_strike = mono_core * this.p_env2 * 1.35;
            let choir_in_L = final_abyss_L + stone_strike + (this.choir_lp_L * 0.95);

const asciiLanesContainer = document.getElementById('ascii-lanes');
const lenBtn = document.getElementById('btn-len');

function updateLenUI() {
    let l = laneLengths[activeTrack];

    let maxPages = Math.max(1, Math.ceil(l / 16));

function selectLane(v) {
    activeTrack = v;
    document.querySelectorAll('.v-sel').forEach(b => b.classList.toggle('active', parseInt(b.dataset.v) === v));
    if (modMode) {
        // Focus first active step on the newly selected lane (if any)
        const offset = viewPage * 16;
        editingStep = null;
        for (let i = 0; i < 16; i++) {
            if (seqTracks[activeTrack][offset + i].trig) { editingStep = offset + i; break; }
        }
    } else {
        editingStep = null;
    }
    updateLenUI();
    syncKnobsToEditState();
    renderAsciiLanes();

function syncKnobsToEditState() {
    document.querySelectorAll('.knob-svg').forEach(k => {
        if (k.id === 'seq_pace' || k.id === 'seq_drag') return;
        k.classList.remove('plocked');
        if (modMode && editingStep !== null) {
            const locks = seqTracks[activeTrack][editingStep].locks;
            if (locks[k.id] !== undefined) {
                k.classList.add('plocked');
                setKnobVisual(k, locks[k.id]);
            } else {
                setKnobVisual(k, baseParams[k.id]);
            }
        } else {
            setKnobVisual(k, baseParams[k.id]);
            liveParams[k.id] = baseParams[k.id];
            sendParam(k.id, baseParams[k.id]);
        }
    });
}

function renderAsciiLanes() {
    asciiLanesContainer.innerHTML = '';
    const offset = viewPage * 16;

    for (let l = 0; l < 4; l++) {
        const row = document.createElement('div');
        row.className = 'ascii-lane-row' + (l === activeTrack ? ' selected-lane' : '');

        const tag = document.createElement('div');
        tag.className = 'lane-tag';
        tag.style.color = laneColors[l];
        tag.textContent = laneLabels[l];
        tag.title = `Select Lane ${laneLabels[l]}`;
        tag.addEventListener('click', () => selectLane(l));
        row.appendChild(tag);

        const activeLen = laneLengths[l];
        for (let i = 0; i < 16; i++) {
            const stepIdx = offset + i;
            const stepObj = seqTracks[l][stepIdx];
            const cell = document.createElement('div');
            cell.className = 'ascii-cell';
            cell.dataset.l = l;

            const hasLocks = Object.keys(stepObj.locks).length > 0;
            const isPlayhead = isPlaying && seqOn && playSteps[l] === stepIdx;
            const isEditing = modMode && l === activeTrack && editingStep === stepIdx;

            if (stepIdx >= activeLen) cell.classList.add('out-bounds');
            if (stepObj.trig) cell.classList.add('trig-on');
            if (hasLocks) cell.classList.add('has-plock');
            if (isPlayhead) cell.classList.add('playhead');
            if (isEditing) cell.classList.add('mod-editing');

            // ASCII Symbol representation
            if (isEditing) {
                cell.textContent = '[#]';
            } else if (isPlayhead) {
                cell.textContent = stepObj.trig ? '[|]' : ' · ';
            } else if (stepObj.trig) {
                cell.textContent = hasLocks ? ' ‡ ' : ' | ';
            } else {
                cell.textContent = ' · ';
            }

            cell.addEventListener('click', e => {
                if (activeTrack !== l) {
                    activeTrack = l;
                    document.querySelectorAll('.v-sel').forEach(b => b.classList.toggle('active', parseInt(b.dataset.v) === l));
                    updateLenUI();
                }

                // Alt-Click sets the polymetric loop length for this lane
                if (e.altKey) {
                    laneLengths[l] = stepIdx + 1;
                    if (playSteps[l] >= laneLengths[l]) playSteps[l] = 0;
                    updateLenUI();
                    renderAsciiLanes();
                    return;
                }

                if (!modMode) {
                    // STEP EDIT MODE (MOD OFF): Cleanly toggle step ON or OFF (and clear locks when turned off)
                    stepObj.trig = !stepObj.trig;
                    if (!stepObj.trig) {
                        stepObj.locks = {};
                    } else if (kamenNode) {
                        // Audition the lane's sonic pulse immediately on click!
                        kamenNode.port.postMessage({ type: 'lane_pulse', lane: l });
                    }
                    editingStep = null;
                    renderAsciiLanes();
                } else {
                    // MOD EDIT MODE (MOD ON): Select active step to lock dials, or click focused step again to clear its locks
                    if (editingStep === stepIdx) {
                        stepObj.locks = {};
                        syncKnobsToEditState();
                    } else {
                        stepObj.trig = true; // Ensure step is active so locks can be heard
                        editingStep = stepIdx;
                        syncKnobsToEditState();
                    }
                    renderAsciiLanes();
                }
            });

            cell.addEventListener('dblclick', () => {
                if (modMode) {
                    stepObj.locks = {};
                    syncKnobsToEditState();
                    renderAsciiLanes();
                }
            });

            row.appendChild(cell);
        }

        const lenTag = document.createElement('div');
        lenTag.className = 'lane-len-tag';
        lenTag.textContent = `/${ String(activeLen).padStart(2, '0') }`;
        lenTag.title = 'Click to select lane';
        lenTag.addEventListener('click', () => selectLane(l));
        row.appendChild(lenTag);

        asciiLanesContainer.appendChild(row);
    }
}

        }
    } else {
        editingStep = null;
    }
    syncKnobsToEditState();
    renderAsciiLanes();
});

document.getElementById('btn-hold-mode').addEventListener('click', e => {
    holdMode = !holdMode;
    e.target.classList.toggle('active', holdMode);
});

// LEN Button: Click to cycle 16/32/48/64 OR Drag vertically for any 1..64 polymetric length
let lenDragging = false, lenStartY = 0, lenStartVal = 16, lenMoved = false;
lenBtn.addEventListener('pointerdown', e => {
    lenDragging = true; lenMoved = false; lenStartY = e.clientY; lenStartVal = laneLengths[activeTrack];
    lenBtn.setPointerCapture(e.pointerId); e.preventDefault();
});
window.addEventListener('pointermove', e => {
    if (!lenDragging) return;
    let dy = lenStartY - e.clientY;
    if (Math.abs(dy) > 4) {
        lenMoved = true;
        let newLen = Math.max(1, Math.min(64, Math.round(lenStartVal + dy * 0.25)));
        laneLengths[activeTrack] = newLen;
        if (playSteps[activeTrack] >= newLen) playSteps[activeTrack] = 0;
        updateLenUI();
        renderAsciiLanes();
    }
});
window.addEventListener('pointerup', e => {
    if (!lenDragging) return;
    lenDragging = false;
    try { lenBtn.releasePointerCapture(e.pointerId); } catch(err){}
    if (!lenMoved) {
        let cur = laneLengths[activeTrack];
        laneLengths[activeTrack] = cur < 16 ? 16 : (cur < 32 ? 32 : (cur < 48 ? 48 : (cur < 64 ? 64 : 16)));
        if (playSteps[activeTrack] >= laneLengths[activeTrack]) playSteps[activeTrack] = 0;
        updateLenUI();
        renderAsciiLanes();
    }
});

pageBtn.addEventListener('click', () => {
    let maxPages = Math.max(1, Math.ceil(laneLengths[activeTrack] / 16));
    viewPage = (viewPage + 1) % maxPages;
    updateLenUI();
    renderAsciiLanes();
});

document.getElementById('btn-clr-lane').addEventListener('click', () => {
    for (let s = 0; s < 64; s++) {
        seqTracks[activeTrack][s].locks = {};
        if (!modMode) seqTracks[activeTrack][s].trig = false;
    }
    editingStep = null;
    syncKnobsToEditState();
    renderAsciiLanes();
});

function applyTargetParam(kId, targetVal, isLocked) {
    liveParams[kId] = targetVal;
    sendParam(kId, targetVal);
    if (!modMode || editingStep === null) {
        const knobEl = document.getElementById(kId);
        if (knobEl) {
            setKnobVisual(knobEl, targetVal);
            knobEl.classList.toggle('mod-active', isLocked);
        }
    }
}

function advanceSequencer() {
    if (!seqOn) return;

    let anyTrig = false;
    let combinedLocks = {};

    for (let l = 0; l < 4; l++) {
        playSteps[l] = (playSteps[l] + 1) % laneLengths[l];
        const stepObj = seqTracks[l][playSteps[l]];

        if (stepObj.trig) {
            anyTrig = true;
            // 1. Fire the lane's built-in DSP liturgical articulation pulse!
            if (kamenNode) {
                kamenNode.port.postMessage({ type: 'lane_pulse', lane: l });
            }
            // 2. Collect any parameter locks on this lane's step (any lane can control any dial)
            for (let kId in stepObj.locks) {
                combinedLocks[kId] = stepObj.locks[kId];
            }
        }
    }

    // Apply collected parameter locks across the machine
    for (let kId in combinedLocks) {
        applyTargetParam(kId, combinedLocks[kId], true);
    }

    // If HOLD is OFF (REV mode) and no active step is locking a parameter on this tick, revert unlocked dials to baseParams
    if (!holdMode) {
        for (let pId of allSynthParams) {
            if (combinedLocks[pId] === undefined) {
                applyTargetParam(pId, baseParams[pId], false);
            }
        }
    }

    renderAsciiLanes();
}

// --- VOTIVE CANDLE ALTAR + VERTICAL SCANLINE RAYS ---
const asciiBed = document.getElementById('ascii-bed');
let candlePhase = 0;

function updateAltarGradient(chaos) {
    const vel = liveParams['VELOCITY'] !== undefined ? liveParams['VELOCITY'] : 0.8;
    const inc = liveParams['INCENSE'] || 0;
    const grav = liveParams['GRAVITY'] || 0.5;
    const pen = liveParams['PENANCE'] || 0;
    const kig = liveParams['KIGAL'] || 0.5;

    const c1 = `rgb(${Math.round(220 + vel * 35)}, ${Math.round(190 + vel * 65 - inc * 60)}, ${Math.round(160 - inc * 100)})`;
    const c2 = `rgb(255, ${Math.round(155 - grav * 75)}, ${Math.round(30 - grav * 30)})`;
    const c3 = `rgb(${Math.round(30 + pen * 190)}, ${Math.round(170 - pen * 50)}, 255)`;
    const c4 = `rgb(${Math.round(30 + chaos * 190)}, ${Math.round(200 + kig * 55 - chaos * 70)}, ${Math.round(80 + chaos * 100)})`;

    asciiBed.style.backgroundImage = `linear-gradient(90deg, ${c1} 12%, ${c2} 38%, ${c4} 52%, ${c3} 74%, ${c2} 92%)`;
    if (chaos > 0.4) {
        asciiBed.style.filter = `drop-shadow(0 0 ${6 + chaos * 10}px rgba(255, 90, 30, ${0.45 + chaos * 0.4}))`;
    } else {
        asciiBed.style.filter = `drop-shadow(0 0 ${4 + vel * 6}px rgba(255, 180, 60, ${0.35 + vel * 0.35}))`;
    }
}

function renderAsciiAltar() {
    const vel = liveParams['VELOCITY'] !== undefined ? liveParams['VELOCITY'] : 0.8;
    const grav = liveParams['GRAVITY'] !== undefined ? liveParams['GRAVITY'] : 0.5;
    const inc = liveParams['INCENSE'] || 0;
    const tithe = liveParams['TITHE'] || 0;
    const orig = liveParams['ORIGIN'] || 0;
    const pen = liveParams['PENANCE'] || 0;
    const sch = liveParams['SCHISM'] || 0;
    const skol = liveParams['SKOL'] || 0;
    const kig = liveParams['KIGAL'] !== undefined ? liveParams['KIGAL'] : 0.5;
    const offer = liveParams['OFFER'] || 0;

    // Chaos index intentionally excludes ALTITUDE (interval selector)
    const rawChaos = (Math.max(0, grav - 0.35) * 1.1 + inc * 1.3 + tithe * 1.2 + orig * 1.0 + pen * 1.1 + sch * 1.2 + skol * 0.9) / 5.2;
    const chaos = Math.min(1.0, Math.max(0.0, rawChaos));

    updateAltarGradient(chaos);

    candlePhase += 0.16 + chaos * 0.32;
    const cols = 136;
    const rows = 6;
    const grid = Array.from({ length: rows }, () => new Array(cols).fill(' '));

    // 1. Project Vertical Sequencer Scanlines from Active Steps into the Altar
    if (isPlaying && seqOn) {
        const offset = viewPage * 16;
        const scanSym = ['|', '*', ':', '!'];
        for (let l = 0; l < 4; l++) {
            let pStep = playSteps[l];
            if (pStep >= offset && pStep < offset + 16) {
                let colSlot = pStep - offset;
                let scanX = Math.round(6 + (colSlot + 0.5) * ((cols - 12) / 16));
                let isTrig = seqTracks[l][pStep] && seqTracks[l][pStep].trig;
                if (isTrig) {
                    // Active step shoots a liturgical beam down into the candle bed
                    for (let r = 0; r < rows; r++) {
                        if (scanX >= 0 && scanX < cols) grid[r][scanX] = r % 2 === 0 ? scanSym[l] : ':';
                    }
                } else if (l === activeTrack && grid[0][scanX] === ' ') {
                    grid[0][scanX] = '.';
                }
            }
        }
    }

    // 2. Render 5 Votive Candles (4 Choir Tapers + 1 Central Kigal Pillar)
    const pulseBoost = (livePulses[0] + livePulses[1] + livePulses[2] + livePulses[3]) * 0.35;
    const candles = [
        { x: 18,  w: 3, gate: liveGates[0], isSub: false, seed: 1.1 },
        { x: 42,  w: 3, gate: liveGates[1], isSub: false, seed: 2.7 },
        { x: 68,  w: 5, gate: Math.min(1, kig * 1.4 + livePulses[3] * 0.8), isSub: true,  seed: 4.3 },
        { x: 94,  w: 3, gate: liveGates[2], isSub: false, seed: 5.9 },
        { x: 118, w: 3, gate: liveGates[3], isSub: false, seed: 7.4 }
    ];

    const breath = 1.0 - (offer * 0.35) + (liveSwell * offer * 0.5);
    const effectiveVel = Math.min(1.0, vel * breath + pulseBoost);
    const maxFlameRows = Math.max(0, Math.min(4, Math.round(effectiveVel * 4.2)));

    for (let idx = 0; idx < candles.length; idx++) {
        const c = candles[idx];
        const gate = c.gate;
        const windBend = Math.sin(candlePhase * 0.85 + c.seed) * (inc * 5.0 + sch * 6.0 + orig * 3.5);

        // Wax Pillar / Taper Body (Rows 4 & 5)
        for (let r = 4; r <= 5; r++) {
            let meltShift = chaos > 0.3 ? Math.round(Math.sin(candlePhase * 0.5 + r * 2 + c.seed) * chaos * 2.5) : 0;
            let bx = c.x + meltShift;
            if (c.isSub) {
                const bodyStr = r === 4 ? "[###]" : "[===]";
                for (let k = 0; k < 5; k++) {
                    let px = bx - 2 + k;
                    if (px >= 0 && px < cols) grid[r][px] = chaos > 0.7 && Math.random() < chaos * 0.35 ? '~' : bodyStr[k];
                }
            } else {
                const bodyStr = r === 4 ? "|#|" : "|=|";
                for (let k = 0; k < 3; k++) {
                    let px = bx - 1 + k;
                    if (px >= 0 && px < cols) grid[r][px] = chaos > 0.7 && Math.random() < chaos * 0.35 ? ':' : bodyStr[k];
                }
            }
        }

        // Flickering Flame or Rising FRAY Smoke (Rows 0 to 3)
        if (gate < 0.35 || maxFlameRows === 0) {
            for (let fr = 1; fr <= 3; fr++) {
                let r = 4 - fr;
                let drift = Math.round(Math.sin(candlePhase * 1.2 + fr * 1.5 + c.seed) * (1.5 + inc * 3.5));
                let px = c.x + drift;
                if (px >= 0 && px < cols) {
                    grid[r][px] = fr === 1 ? "'" : (fr === 2 ? ':' : '~');
                }
            }
        } else {
            for (let fr = 1; fr <= maxFlameRows; fr++) {
                let r = 4 - fr;
                let heightRatio = fr / maxFlameRows;
                let flicker = Math.sin(candlePhase * 2.1 + fr * 1.4 + c.seed) * (0.5 + chaos * 2.5);
                let cx = Math.round(c.x + windBend * heightRatio + flicker);

                if (fr === maxFlameRows) {
                    let tipChar = effectiveVel > 0.6 ? '^' : (effectiveVel > 0.25 ? '*' : '.');
                    if (cx >= 0 && cx < cols) grid[r][cx] = tipChar;
                } else if (fr === 1 && maxFlameRows >= 2) {
                    let coreStr = c.isSub ? "( | )" : "(|)";
                    let half = Math.floor(coreStr.length / 2);
                    for (let k = 0; k < coreStr.length; k++) {
                        let px = cx - half + k;
                        if (px >= 0 && px < cols) grid[r][px] = coreStr[k];
                    }
                } else {
                    let midStr = c.isSub ? "/ * \\" : "(*)";
                    let half = Math.floor(midStr.length / 2);
                    for (let k = 0; k < midStr.length; k++) {
                        let px = cx - half + k;
                        if (px >= 0 && px < cols) grid[r][px] = midStr[k];
                    }
                }
            }
        }
    }

    // 3. Chaos Wind Shear & Spectral Ash Smear
    if (chaos > 0.08) {
        const ghostChars = ".,:;~=*+#%@";
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (grid[r][c] !== ' ' && chaos > 0.2) {
                    let smearDir = Math.sin(candlePhase * 0.4 + r) >= 0 ? 1 : -1;
                    let smearLen = Math.floor(chaos * 7);
                    for (let s = 1; s <= smearLen; s++) {
                        let sc = c + s * smearDir;
                        if (sc >= 0 && sc < cols && grid[r][sc] === ' ') {
                            grid[r][sc] = s === smearLen ? '.' : (s % 2 === 0 ? '~' : '-');
                        }
                    }
                } else if (grid[r][c] === ' ') {
                    let hash = Math.sin((c + Math.floor(candlePhase * 2)) * 12.9898 + r * 78.233) * 43758.5453;
                    let rand = hash - Math.floor(hash);
                    if (rand > 0.982 - chaos * 0.16) {
                        let gIdx = Math.min(ghostChars.length - 1, Math.floor(rand * chaos * ghostChars.length));
                        grid[r][c] = ghostChars[gIdx];
                    }
                }
            }
        }
    }

    asciiBed.textContent = grid.map(row => row.join('')).join('\n');
}

setInterval(renderAsciiAltar, 60);
renderAsciiAltar();
</script>
